  <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="none" stroke="#2b2b2b"/>
  <rect x="3.5" y="2.5" width="6.5" height="13" rx="1.5" fill="#ededed"/>
  <rect x="14" y="8.5" width="6.5" height="13" rx="1.5" fill="#ededed"/>
</svg>
